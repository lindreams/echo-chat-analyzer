[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qq-chat-analyzer"
version = "0.2.0"
description = "A privacy-first, fully local QQ and WeChat chat analyzer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jieba>=0.42.1,<0.43",
    "matplotlib>=3.8,<4",
    "wordcloud>=1.9.3,<2",
    "zstandard>=0.22,<1",
]

[project.scripts]
echo-chat = "qq_chat_analyzer.cli:main"
echo-gui = "qq_chat_analyzer.desktop:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
gui = [
    "PySide6>=6.6,<7",
    "velopack==1.2.161",
]
# Windows release build toolchain. `scripts/build_windows_exe.ps1` runs the
# project .venv PyInstaller and fails closed when it is missing, so the exact
# tool that produced the released frozen artifact is pinned here.
# `pyinstaller-hooks-contrib` is pinned explicitly because its hooks decide which
# package data files (for example jieba's) the frozen package carries.
build = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow_integration: heavy integration excluded from the Fast Suite (real subprocess/browser/packaging/Qt-heavy)",
    "known_failure: pre-existing known-failing test quarantined from the Fast Suite (not fixed by this task)",
]
